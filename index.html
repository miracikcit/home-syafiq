<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(r => {
  const bar = () => { if (document.querySelector('.updbar')) return; const b = document.createElement('button'); b.className = 'updbar btn'; b.textContent = 'Versi baru Home Syafiq. Tekan untuk muat semula';
    b.onclick = () => { const w = r.waiting; if (w) w.postMessage({ t: 'skip' }); else location.reload(); }; document.body.appendChild(b); };
  if (r.waiting && navigator.serviceWorker.controller) bar();
  r.addEventListener('updatefound', () => { const n = r.installing; n && n.addEventListener('statechange', () => { if (n.state === 'installed' && navigator.serviceWorker.controller) bar(); }); });
  let done = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!done) { done = true; location.reload(); } });
  setInterval(() => r.update().catch(() => {}), 30 * 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); });
}).catch(() => {});
</script>
